services:
  minio:
    image: minio/minio
    container_name: warehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - warehouse_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  warehouse_minio_data:
