name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =====================================================
      # MAIN WAREHOUSE API
      # =====================================================
      - name: Build and push Warehouse API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Warehouse.Presentation/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/warehouse-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/warehouse-api:${{ github.sha }}

      # =====================================================
      # NOTIFICATIONS API
      # =====================================================
      - name: Build and push Notifications API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Warehouse.Notifications/Warehouse.Notifications.Api/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/warehouse-notifications-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/warehouse-notifications-api:${{ github.sha }}